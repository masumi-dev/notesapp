version: 1
backend:
  phases:
    build:
      commands:
        - npm install --cache .npm --prefer-offline
        - |
          if command -v aws >/dev/null 2>&1; then
            if aws sts get-caller-identity >/dev/null 2>&1; then
              echo "STS_CHECK=OK"
            else
              echo "STS_CHECK=FAILED"
            fi
          else
            echo "AWS_CLI_NOT_INSTALLED"
          fi
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --debug
frontend:
  phases:
    preBuild:
      commands:
        - npm install --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
